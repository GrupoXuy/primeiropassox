<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Login administrativo | Primeiro Passo X</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
<link rel="stylesheet" href="assets/admin.css">
</head>
<body class="login-page">

<main class="login-card" aria-labelledby="login-titulo">
  <img src="../assets/img/logo.jpeg" alt="Primeiro Passo X" width="88" height="88">
  <span class="eyebrow" style="font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;color:#8a6a2f;font-weight:800">Área restrita</span>
  <h1 id="login-titulo">Painel administrativo</h1>
  <p>Acesso exclusivo para administradores autorizados da Primeiro Passo X.</p>

  <form id="loginForm" novalidate>
    <label for="email">E-mail corporativo</label>
    <input id="email" name="email" type="email" autocomplete="username" required placeholder="seu.email@empresa.com" inputmode="email">
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required placeholder="••••••••••">
    <div class="login-error" id="loginError" role="alert"></div>
    <button type="submit" class="adm-btn solid" style="width:100%;justify-content:center;padding:.75rem;font-size:.9rem;margin-top:1.1rem" id="loginBtn">Entrar</button>
  </form>

  <p class="login-note">Esta área é exclusiva para administradores autorizados. Tentativas indevidas são registradas.</p>
  <p class="login-note"><a href="/admin/primeiro-acesso.html" style="color:#8a6a2f;font-weight:700">Primeiro acesso? Criar minha senha</a></p>
  <p class="login-note"><a href="../index.html" style="color:#8a6a2f;font-weight:700">← Voltar para o site</a></p>
</main>

<script src="assets/login.js"></script>
</body>
</html>
